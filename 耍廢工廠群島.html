<style>
/* Layout: full-bleed 3D tidal-flat scene; floating chrome; island card slides in (right on desktop, bottom sheet on phone) */
:root{
  --bg:#e5ebe7; --ink:#1e2a29; --muted:#5a6a66; --card:#f6f8f4; --line:#c7d1cb;
  --accent:#c4412c; --sea:#4b858d; --chip:#e9eee9;
  --f-display:"Huninn","Noto Sans TC","PingFang TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1c; --ink:#e4ebe7; --muted:#93a39f; --card:#1a2426; --line:#2d3a3c;
  --accent:#ea6a52; --sea:#72b2ba; --chip:#243033; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1c; --ink:#e4ebe7; --muted:#93a39f; --card:#1a2426; --line:#2d3a3c;
  --accent:#ea6a52; --sea:#72b2ba; --chip:#243033; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:12px 16px;max-width:340px}
.brand .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4.4vw,30px);line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.brand p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.seg{display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:12.5px;padding:6px 11px;border-radius:999px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button:focus-visible,.tag:focus-visible,.close:focus-visible,.list-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clock{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;padding-right:6px}

#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:var(--f-display);font-size:15px;padding:5px 12px 5px 9px;border-radius:999px;display:flex;align-items:center;gap:7px;
  box-shadow:0 2px 10px rgb(0 0 0 / .12);white-space:nowrap}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tag small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em}
.tag.lm{font-size:13px;border-style:dashed}
.tag.br{font-size:11.5px;padding:3px 9px 3px 7px;gap:5px;font-family:var(--f-body);opacity:.92}
.tag.br i{width:7px;height:7px;border-radius:2px}
.tag.lm i{border-radius:2px;background:repeating-linear-gradient(180deg,#1d1d1d 0 2px,#f2f2f2 2px 4px);border:1px solid #1d1d1d}
.tag:hover,.tag.hot{background:var(--ink);color:var(--card)}
.tag:hover small,.tag.hot small{color:inherit}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;
  font-family:var(--f-mono);font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--card) 80%,transparent);padding:6px 12px;border-radius:999px;letter-spacing:.06em;white-space:nowrap}

#panel{position:fixed;z-index:8;background:var(--card);border-left:1px solid var(--line);
  top:0;right:0;bottom:0;width:min(420px,100%);overflow-y:auto;
  padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));
  transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-10px 0 30px rgb(0 0 0 / .12)}
#panel.open{transform:none}
.close{all:unset;cursor:pointer;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:16px}
.p-kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:8px}
.p-kicker i{width:10px;height:10px;border-radius:3px;background:var(--c)}
#panel h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:8px 0 4px;line-height:1.15;padding-right:40px}
.p-sub{font-size:13px;color:var(--accent);margin-bottom:14px}
.p-lead{font-size:15px;line-height:1.8;margin:0 0 20px;max-width:65ch}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.items li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.items b{font-weight:700;font-size:15px}
.items li.ih{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);padding:22px 0 8px}
.items p{grid-column:1/-1;margin:0;font-size:13.5px;line-height:1.7;color:var(--muted)}
.st{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);align-self:start;white-space:nowrap;border:1px solid var(--line)}
.st.todo{border-style:dashed;color:var(--muted)}
.st.win{background:var(--accent);color:#fff;border-color:transparent}
.p-src{margin-top:16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.p-src a{color:var(--sea)}
.p-note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.p-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.p-nav button{all:unset;cursor:pointer;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--chip)}
.p-nav button:focus-visible{outline:2px solid var(--accent)}

#list{position:fixed;inset:0;z-index:7;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);overflow-y:auto;
  padding-top:calc(150px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.list-grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.list-item{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.list-item .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);display:flex;gap:8px;align-items:center}
.list-item .k i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.list-item h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.list-item p{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.list-item:hover{border-color:var(--ink)}

#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3}
.bubble{position:absolute;left:0;top:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:5px 10px;
  font-size:12px;line-height:1.5;max-width:190px;width:max-content;box-shadow:0 3px 12px rgb(0 0 0 / .14);opacity:0;transition:opacity .35s}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
#talk{position:fixed;z-index:9;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(400px,calc(100% - 32px));background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px 12px;
  box-shadow:0 8px 28px rgb(0 0 0 / .2)}
.t-head{display:flex;align-items:center;gap:8px}
.t-head i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.t-head b{font-family:var(--f-display);font-weight:400;font-size:18px}
.t-head span{font-size:12px;color:var(--muted);flex:1;min-width:0}
.t-head button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:13px}
#t-text{margin:10px 0 12px;font-size:15px;line-height:1.75;min-height:3.5em;cursor:pointer}
.t-topics{display:flex;flex-wrap:wrap;gap:6px}
.t-topics button,.t-foot button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip)}
.t-topics button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.t-foot{display:flex;justify-content:flex-end;margin-top:10px}
.t-foot button{background:var(--ink);color:var(--card);border-color:var(--ink)}
.t-topics button:focus-visible,.t-foot button:focus-visible,.t-head button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){

  .brand{max-width:none;flex:1;padding:10px 12px}
  .brand p{display:none}
  .top{flex-direction:column;align-items:stretch}
  .tools{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .clock{display:none}
  #panel{top:auto;left:0;width:100%;max-height:62%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:22px;transform:translateY(105%)}
  .close{top:14px}
  #panel h2{font-size:26px}
  #list{padding-top:calc(170px + env(safe-area-inset-top,0px))}
  .tag{font-size:13px}
  .tag small{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

const deckMat = M(0x9b7a55), railMat = M(0x6f5a43), pathMat = M(0xc9b48a);
function bridge(a,b,w=1.4){
  const dx=b.x-a.x, dz=b.z-a.z, L=Math.hypot(dx,dz);
  const g = new THREE.Group(); g.position.set((a.x+b.x)/2,0,(a.z+b.z)/2); g.rotation.y = -Math.atan2(dz,dx);
  box(L,.2,w,deckMat,g,0,.8,0);
  [-1,1].forEach(s=>{
    box(L,.07,.07,railMat,g,0,1.55,s*w/2);
    for(let x=-L/2+.6;x<=L/2-.6;x+=1.6) cyl(.05,.05,.6,4,railMat,g,x,.95,s*w/2);
    for(let x=-L/2+1.5;x<=L/2-1.5;x+=3) cyl(.09,.09,2.4,5,railMat,g,x,-1.6,s*(w/2-.15));
  });
  scene.add(g);
}
function strip(a,b,w=1.1){
  const dx=b.x-a.x, dz=b.z-a.z, L=Math.hypot(dx,dz);
  const m = add(new THREE.BoxGeometry(L+w*.6,.05,w), pathMat, scene, (a.x+b.x)/2, 1.02, (a.z+b.z)/2, false);
  m.rotation.y = -Math.atan2(dz,dx);
}
const V = (x,z)=>new THREE.Vector3(x,0,z);
const loop = [];
ISLANDS.forEach((d,i)=>{
  const c = placeGroups[d.id].position, p = placeGroups[ISLANDS[(i+4)%5].id].position, n = placeGroups[ISLANDS[(i+1)%5].id].position;
  const dp = V(p.x-c.x,p.z-c.z).normalize(), dn = V(n.x-c.x,n.z-c.z).normalize();
  const entry = V(c.x,c.z).addScaledVector(dp, d.r-.3);
  const mid = V(c.x,c.z).addScaledVector(dp.clone().add(dn).normalize(), 2.6);
  const exit = V(c.x,c.z).addScaledVector(dn, d.r-.3);
  strip(entry,mid); strip(mid,exit);
  loop.push(entry, mid, exit);
});
for(let i=0;i<5;i++) bridge(loop[i*3+2], loop[((i+1)%5)*3]);
// spur: 風灣的船 → 王功燈塔
{
  const c = boatPos, L = lh.position, dir = V(L.x-c.x, L.z-c.z).normalize();
  const a = V(c.x,c.z).addScaledVector(dir, ISLANDS[4].r-.3), b = V(L.x,L.z).addScaledVector(dir, -2.4);
  bridge(a,b,1.2); strip(V(c.x,c.z).addScaledVector(dir,2), a);
}
// spur: 雷打石 → 中央蚵田
{
  const c = leiPos, dir = V(-c.x,-c.z).normalize();
  bridge(V(c.x,c.z).addScaledVector(dir, ISLANDS[0].r-.3), V(0,0).addScaledVector(dir,-8.6), 1.2);
}
const segs = []; let total = 0;
for(let i=0;i<loop.length;i++){ const a=loop[i], b=loop[(i+1)%loop.length], l=a.distanceTo(b); segs.push({a,b,l,s:total}); total+=l; }
function along(s, out){
  s = ((s%total)+total)%total;
  let lo=0; while(lo<segs.length-1 && segs[lo+1].s<=s) lo++;
  const g = segs[lo], k = (s-g.s)/g.l;
  out.lerpVectors(g.a,g.b,k); return g;
}

/* tides: anchored on 2026-10-26 王功 (DudeFishinG), stepped by the M2 period */
const TIDE = { hi:Date.parse("2026-10-26T10:43:00+08:00"), lo:Date.parse("2026-10-26T04:23:00+08:00"), P:12.4206*3600e3 };
const TP = 8*3600e3;
const hm = ts => { const d = new Date(ts+TP); return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); };
function todayInfo(){
  const now = Date.now(), d = new Date(now+TP);
  const start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - TP, end = start + 864e5;
  const inDay = base => { const out=[]; let n = Math.ceil((start-base)/TIDE.P); for(let t=base+n*TIDE.P; t<end; t+=TIDE.P) out.push(t); return out; };
  const his = inDay(TIDE.hi), los = inDay(TIDE.lo);
  const nextOf = base => base + Math.ceil((now-base)/TIDE.P)*TIDE.P;
  const nh = nextOf(TIDE.hi), nl = nextOf(TIDE.lo);
  return { date:`${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 星期${"日一二三四五六"[d.getUTCDay()]}`,
    his:his.map(hm).join("、"), los:los.map(hm).join("、"),
    next: nh < nl ? `下一次滿潮大約 ${hm(nh)}` : `下一次乾潮大約 ${hm(nl)}`,
    far: Math.abs(now - TIDE.hi) > 30*864e5 };
}

const bubblesEl = document.getElementById("bubbles");
const bubbles = [];
function spawnBubble(){
  if(bubbles.length >= 3) return;
  const free = people.filter(pp=>!pp.paused && !bubbles.some(b=>b.pp===pp));
  if(!free.length) return;
  const pp = pick1(free), el = document.createElement("div");
  el.className = "bubble"; el.textContent = pick1(AMBIENT());
  bubblesEl.appendChild(el); requestAnimationFrame(()=>el.classList.add("on"));
  const b = {pp, el}; bubbles.push(b);
  setTimeout(()=>{ el.classList.remove("on"); setTimeout(()=>{ el.remove(); bubbles.splice(bubbles.indexOf(b),1); }, 400); }, 4200);
}

document.getElementById("t-next").addEventListener("click", ()=>say(Math.random()<.35 ? pick1(Object.keys(TOPICS)) : topic));
document.getElementById("t-close").addEventListener("click", endTalk);


/* ---------- sea & sky life ---------- */
// 中華白海豚
const dolphins = [];
for(let i=0;i<3;i++){
  const g = new THREE.Group();
  const body = add(new THREE.SphereGeometry(.5,8,6), M(0xe9c3c0,{roughness:.5}), g, 0,0,0, false); body.scale.set(.7,.6,2);
  add(new THREE.ConeGeometry(.35,.6,4), M(0xe0b0ad), g, 0,.45,-.1, false).rotation.x = -.5;
  const tail = add(new THREE.BoxGeometry(.9,.06,.35), M(0xe0b0ad), g, 0,0,-1.1, false);
  g.userData = {ph:i*.9, off:i*.06, r:36+i*1.2};
  scene.add(g); dolphins.push(g);
}
// fishing rafts
const rafts = [];
for(let i=0;i<3;i++){
  const g = new THREE.Group();
  for(let k=-2;k<=2;k++) add(new THREE.CylinderGeometry(.18,.18,4,6), M(0xd8d4c4), g, k*.36,.1,0).rotation.x = Math.PI/2;
  box(1,.8,1,0xf2efe6,g,0,.25,.6);
  cyl(.04,.04,1.6,4,0x5a4636,g,0,.25,-1.4);
  box(.5,.32,.02,[0xc4412c,0x2f5d8a,0xe0a32e][i],g,.26,1.4,-1.4);
  g.userData = {r:46+i*5, sp:(.02+i*.006)*(i%2?-1:1), ph:i*2.1};
  scene.add(g); rafts.push(g);
}
// egrets & gulls
const birds = [];
for(let i=0;i<9;i++){
  const g = new THREE.Group();
  const c = i%3===0 ? 0x9aa3a8 : 0xfafafa;
  add(new THREE.ConeGeometry(.16,.9,5), M(c), g, 0,0,0, false).rotation.x = Math.PI/2;
  const wings = [-1,1].map(s=>{ const piv = new THREE.Group(); add(new THREE.BoxGeometry(1,.03,.36), M(c), piv, s*.5,0,0, false); g.add(piv); return piv; });
  g.userData = {wings, r:14+Math.random()*26, h:10+Math.random()*9, sp:(.15+Math.random()*.15)*(i%2?1:-1), ph:Math.random()*6, cx:(Math.random()-.5)*10, cz:(Math.random()-.5)*10};
  scene.add(g); birds.push(g);
}
// 海牛車 crossing the central flat
const ox = new THREE.Group();
box(1.4,.8,.7,0x5a4232,ox,0,.5,0);
box(.5,.45,.45,0x4a3628,ox,.9,.8,0);
[-1,1].forEach(s=>add(new THREE.ConeGeometry(.05,.35,4), M(0xe9e1cf), ox, .95,1.35,s*.18).rotation.x = s*.6);
[[-.5,-.25],[-.5,.25],[.5,-.25],[.5,.25]].forEach(([x,z])=>box(.14,.5,.14,0x4a3628,ox,x,0,z));
box(1.8,.12,1.2,0x9b7a55,ox,-1.9,.75,0);
[-1,1].forEach(s=>add(new THREE.CylinderGeometry(.55,.55,.1,10), M(0x6f5a43), ox, -1.9,.55,s*.66).rotation.x = Math.PI/2);
for(let i=0;i<3;i++) cyl(.25,.2,.35,7,0xc9b48a,ox,-2.4+i*.5,.87,0);
ox.position.set(0,-.1,6); scene.add(ox);

/* ---------- time of day ---------- */
const TIMES = {
  dawn:{sky:0xf0d5c4, hemi:[0xffe2cc,0x6b7f78,.75], sun:[0xffb38a,.95,[-30,16,20]], water:0x5a8e9c, glow:.45, beam:.12, plight:.3, label:"06:00 芳苑的清晨"},
  day: {sky:0xcfe2e3, hemi:[0xffffff,0x6b7f78,.8],  sun:[0xfff4e2,1.15,[18,40,22]], water:0x2b6a80, glow:.15, beam:0, plight:0,   label:"12:00 芳苑的午後"},
  dusk:{sky:0xe7a587, hemi:[0xffc8a8,0x5d5a6e,.6],  sun:[0xff8a5a,.85,[32,12,-14]], water:0x5d6f8e, glow:.9,  beam:.22, plight:1.1, label:"18:00 芳苑的黃昏"},
  night:{sky:0x18222e,hemi:[0x8ea3c7,0x1b2028,.35], sun:[0x9fb4dc,.35,[-14,30,-20]], water:0x1d2e44, glow:1.8, beam:.38, plight:2.2, label:"22:00 芳苑的夜晚"}
};
function setTime(k){
  const t = TIMES[k];
  scene.background = new THREE.Color(t.sky); scene.fog.color.set(t.sky);
  hemi.color.set(t.hemi[0]); hemi.groundColor.set(t.hemi[1]); hemi.intensity = t.hemi[2];
  sun.color.set(t.sun[0]); sun.intensity = t.sun[1]; sun.position.set(...t.sun[2]);
  waterMat.color.set(t.water);
  glowMats.forEach(m=>m.emissiveIntensity = t.glow);
  beamMat.opacity = t.beam; if(boatLight) boatLight.intensity = t.plight;
  document.getElementById("clock").textContent = t.label; curTime = k;
  document.querySelectorAll("[data-time]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.time===k));
}
document.querySelectorAll("[data-time]").forEach(b=>b.addEventListener("click",()=>setTime(b.dataset.time)));
const hr = new Date().getHours();
setTime(hr>=5&&hr<9?"dawn":hr<16&&hr>=9?"day":hr>=16&&hr<19?"dusk":"night");

/* ---------- labels ---------- */
const tagsEl = document.getElementById("tags");
const tagEls = {};
PLACES.forEach(d=>{
  const b = document.createElement("button");
  b.className = "tag" + (d.landmark ? " lm" : d.brand ? " br" : ""); b.style.setProperty("--c", d.color);
  b.innerHTML = `<i></i>${d.name}${(d.landmark||d.brand)?"":`<small>${d.no}</small>`}`;
  b.setAttribute("aria-label", `打開 ${d.name}`);
  b.addEventListener("click", ()=>openPlace(d.id));
  tagsEl.appendChild(b); tagEls[d.id] = b;
});

/* ---------- panel ---------- */
const panel = document.getElementById("panel"), body = document.getElementById("panel-body");
let current = null;
function openPlace(id){
  const d = PLACES.find(x=>x.id===id); if(!d) return;
  let prev, next;
  if(d.landmark){ prev = ISLANDS[4]; next = ISLANDS[0]; }
  else if(d.brand){ const k = BRANDS.indexOf(d); prev = k===0 ? ISLANDS[4] : BRANDS[k-1]; next = k===BRANDS.length-1 ? ISLANDS[4] : BRANDS[k+1]; }
  else { const i = ISLANDS.indexOf(d); prev = ISLANDS[(i+4)%5]; next = ISLANDS[(i+1)%5]; }
  panel.style.setProperty("--c", d.color);
  const hasTodo = d.items.some(it=>it.todo);
  body.innerHTML = `
    <div class="p-kicker"><i></i>${d.landmark?"LANDMARK":d.brand?"PARTNER":d.no} · ${d.en}</div>
    <h2>${d.name}</h2>
    <div class="p-sub">${d.sub}</div>
    <p class="p-lead">${d.lead}</p>
    <ul class="items">${d.items.map(it=>it.h?`<li class="ih">${it.h}</li>`:`<li><b>${it.t}</b><span class="st${it.todo?' todo':''}${it.win?' win':''}">${it.s}</span><p>${it.d}</p></li>`).join("")}</ul>
    ${d.src?`<div class="p-src">資料來源 ${d.src.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>`:""}
    ${hasTodo?`<div class="p-note">虛線標籤的項目還要補上正式內容。</div>`:""}
    <div class="p-nav"><button data-go="${prev.id}">← ${prev.name}</button><button data-go="${next.id}">${next.name} →</button></div>`;
  body.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>openPlace(b.dataset.go)));
  panel.classList.add("open"); panel.setAttribute("aria-hidden","false");
  panel.scrollTop = 0;
  setView("map");
  current = id; controls.autoRotate = false;
  flyTo(placeGroups[id].position, d.landmark);
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  document.getElementById("hint").hidden = true;
}
function closePanel(){
  panel.classList.remove("open"); panel.setAttribute("aria-hidden","true");
  current = null; fly(HOME.pos.clone(), HOME.target.clone(), ()=>{ controls.autoRotate = !reduce; });
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}
document.getElementById("close").addEventListener("click", closePanel);
addEventListener("keydown", e=>{ if(e.key!=="Escape") return; if(talking) endTalk(); else if(current) closePanel(); });

/* ---------- camera flights ---------- */
let flight = null;
function fly(pos, target, done){
  if(reduce){ camera.position.copy(pos); controls.target.copy(target); done&&done(); return; }
  flight = { p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:target, s:performance.now(), dur:1100, done };
}
function flyTo(p, tall){
  const mobile = innerWidth <= 640;
  const target = p.clone(); if(tall) target.y += 4;
  const dir = new THREE.Vector3(p.x,0,p.z).normalize();
  const pos = p.clone().add(dir.multiplyScalar(16)).add(new THREE.Vector3(0, tall?10:12, 0));
  if(mobile){ target.y -= 4.5; }
  else {
    const right = new THREE.Vector3().subVectors(target,pos).cross(new THREE.Vector3(0,1,0)).normalize().multiplyScalar(4.5);
    target.add(right); pos.add(right);
  }
  fly(pos, target);
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null, hover = null;
const pickables = Object.values(placeGroups);
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, true);
  for(const h of hits){ let o = h.object; while(o && !o.userData.id) o = o.parent; if(o) return o.userData.id; }
  return null;
}
function pickPerson(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const h = ray.intersectObjects(hitMeshes, false)[0];
  return h ? h.object.userData.pi : null;
}
renderer.domElement.addEventListener("pointerdown", e=>{ down = {x:e.clientX,y:e.clientY}; controls.autoRotate = false; });
renderer.domElement.addEventListener("pointerup", e=>{
  if(down && Math.hypot(e.clientX-down.x, e.clientY-down.y) < 6){ const who = pickPerson(e); if(who!=null) talkTo(who); else { const id = pick(e); if(id) openPlace(id); } }
  down = null;
});
renderer.domElement.addEventListener("pointermove", e=>{
  if(e.pointerType!=="mouse") return;
  if(pickPerson(e)!=null){ renderer.domElement.style.cursor = "pointer"; return; }
  const id = pick(e);
  if(id!==hover){ if(hover) tagEls[hover].classList.remove("hot"); hover = id; if(id) tagEls[id].classList.add("hot"); renderer.domElement.style.cursor = id?"pointer":"grab"; }
});

/* ---------- list view ---------- */
const listEl = document.getElementById("list"), grid = document.getElementById("list-grid");
grid.innerHTML = PLACES.filter(d=>!d.brand).map(d=>`<button class="list-item" style="--c:${d.color}" data-id="${d.id}">
  <span class="k"><i></i>${d.landmark?"LANDMARK":d.no} · ${d.en}</span><h3>${d.name}</h3><p>${d.lead}</p></button>`).join("");
grid.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openPlace(b.dataset.id)));
function setView(v){
  document.getElementById("v-map").setAttribute("aria-pressed", v==="map");
  document.getElementById("v-list").setAttribute("aria-pressed", v==="list");
  listEl.hidden = v!=="list"; tagsEl.style.visibility = v==="list"?"hidden":"visible";
}
document.getElementById("v-map").addEventListener("click",()=>setView("map"));
document.getElementById("v-list").addEventListener("click",()=>{ if(current) closePanel(); setView("list"); });

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h); camera.aspect = w/h;
  camera.fov = w < 640 ? 54 : 40; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const v3 = new THREE.Vector3(), tmp = new THREE.Vector3(), side = new THREE.Vector3(), clock = new THREE.Clock();
let last = 0;
function tick(){
  const t = clock.getElapsedTime(), dt = Math.min(.05, t-last); last = t;
  const m = reduce ? 0 : 1;
  if(m){
    const p = waterGeo.attributes.position.array;
    for(let i=0;i<p.length;i+=3){ p[i+1] = Math.sin(wBase[i]*.18 + t*.9)*.18 + Math.cos(wBase[i+2]*.21 + t*.7)*.15; }
    waterGeo.attributes.position.needsUpdate = true;
    if(boatHull){ boatHull.position.y = Math.sin(t*1.3)*.15; boatHull.rotation.z = Math.sin(t*1.1)*.05; }
    puffs.forEach(o=>{
      const k = (o.userData.t + t*.12) % 1;
      o.position.copy(o.userData.origin).add(v3.set(k*1.2, k*3.2, -k*.6));
      o.scale.setScalar(.5 + k*1.4); o.material.opacity = .8*(1-k);
    });
    beam.rotation.y = t*.8;
    drapes.forEach(dm=>{
      const pa = dm.geometry.attributes.position.array, base = dm.userData.base;
      for(let i=0;i<pa.length;i+=3){ const hang = -base[i+1]; pa[i+2] = Math.sin(base[i]*2.2 + t*2.1 + dm.userData.ph)*.16*hang + hang*.12; }
      dm.geometry.attributes.position.needsUpdate = true;
    });
  }
  // people walking the loop
  people.forEach(pp=>{
    if(!pp.paused) pp.s += pp.v*dt*m;
    const g = along(pp.s, v3);
    side.subVectors(g.b,g.a).normalize();
    const heading = pp.v>0 ? side : side.clone().negate();
    tmp.set(-side.z,0,side.x).multiplyScalar(pp.lane);
    pp.g.position.set(v3.x+tmp.x, 1.02 + Math.abs(Math.sin(t*7+pp.ph))*.04*m, v3.z+tmp.z);
    pp.g.rotation.y = pp.paused ? Math.atan2(camera.position.x-pp.g.position.x, camera.position.z-pp.g.position.z) : Math.atan2(heading.x, heading.z);
    const sw = pp.paused ? 0 : Math.sin(t*7+pp.ph)*.5*m;
    pp.legs[0].rotation.x = sw; pp.legs[1].rotation.x = -sw;
  });
  // dolphins
  dolphins.forEach(d=>{
    const u = d.userData, a = t*.12*m + u.off + 1.2;
    const y = Math.sin(t*1.5 + u.ph)*1.9 - .4;
    d.position.set(Math.cos(a)*u.r, Math.max(y,-1.8), Math.sin(a)*u.r);
    d.rotation.y = -a; d.rotation.x = -Math.cos(t*1.5+u.ph)*.6;
  });
  rafts.forEach(r=>{
    const u = r.userData, a = u.ph + t*u.sp*m;
    r.position.set(Math.cos(a)*u.r, Math.sin(t*1.2+u.ph)*.12, Math.sin(a)*u.r);
    r.rotation.y = -a + (u.sp>0?0:Math.PI); r.rotation.z = Math.sin(t+u.ph)*.04;
  });
  birds.forEach(b=>{
    const u = b.userData, a = u.ph + t*u.sp*(m||.0);
    b.position.set(u.cx + Math.cos(a)*u.r, u.h + Math.sin(t*.7+u.ph)*.6, u.cz + Math.sin(a)*u.r);
    b.rotation.y = -a + (u.sp>0 ? Math.PI : 0);
    const f = Math.sin(t*6+u.ph)*.6*m; u.wings[0].rotation.z = f; u.wings[1].rotation.z = -f;
  });
  {
    const k = (Math.sin(t*.08*m)+1)/2, x = -6 + k*12;
    const dirx = Math.cos(t*.08*m) >= 0 ? 1 : -1;
    ox.position.x = x; ox.rotation.y = dirx>0 ? 0 : Math.PI;
  }
  if(flight){
    const k = Math.min(1,(performance.now()-flight.s)/flight.dur), e = 1-Math.pow(1-k,3);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    if(k===1){ const d = flight.done; flight = null; d&&d(); }
  }
  controls.update();
  renderer.render(scene, camera);
  const w = innerWidth, h = innerHeight;
  PLACES.forEach(d=>{
    const g = placeGroups[d.id];
    v3.copy(g.position); v3.y += d.tagH; v3.project(camera);
    const el = tagEls[d.id];
    if(v3.z > 1){ el.style.opacity = 0; return; }
    el.style.opacity = 1;
    el.style.transform = `translate(${(v3.x*.5+.5)*w}px, ${(-v3.y*.5+.5)*h}px) translate(-50%,-100%)`;
    el.style.zIndex = String(Math.round((1-v3.z)*1000));
  });
  bubbles.forEach(b=>{
    v3.copy(b.pp.g.position); v3.y += 1.6; v3.project(camera);
    if(v3.z > 1){ b.el.style.visibility = "hidden"; return; }
    b.el.style.visibility = "visible";
    b.el.style.transform = `translate(${(v3.x*.5+.5)*w}px, ${(-v3.y*.5+.5)*h}px) translate(-50%,calc(-100% - 8px))`;
  });
  requestAnimationFrame(tick);
}
tick();

const start = (location.hash||"").slice(1);
if(placeGroups[start]) setTimeout(()=>openPlace(start), 400);
</script>
